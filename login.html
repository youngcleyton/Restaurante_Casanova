<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Sabor de Quelimane</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css"/>
</head>
<body>

<div class="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#E87722"/>
            <stop offset="100%" stop-color="#8B0000"/>
          </linearGradient>
        </defs>
        <path d="M8 16 Q20 8 32 16 L32 26 Q20 34 8 26 Z" fill="url(#logGrad)"/>
        <ellipse cx="20" cy="16" rx="12" ry="3" fill="#FFD200"/>
      </svg>
    </div>
    <h1><span class="laranja">SABOR</span> <span class="vermelho">DE QUELIMANE</span></h1>
    <p class="login-sub">Painel Administrativo · Quelimane</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label>Utilizador</label>
        <input type="text" id="loginUser" placeholder="restaurante" autofocus/>
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="loginPass" placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn-login">ENTRAR</button>
      <p class="login-error" id="loginError"></p>
    </form>

    <a href="index.html" class="back-link">← Voltar ao site</a>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
